# Vite & Gourmand — hôte virtuel Apache du conteneur "app"
#
# Même organisation qu'en production :
#   - le front statique (front/) est la racine du site, son .htaccess gère
#     les URL propres (/menus, /menus/12, /commande…) ;
#   - toute requête /api/* est réécrite vers index.php, que l'alias ci-dessous
#     fait pointer sur le contrôleur frontal Symfony (api/public/index.php).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/front

    Alias /index.php /var/www/api/public/index.php

    # Avec mod_php, les variables d'environnement du conteneur ne sont pas
    # visibles par PHP ($_SERVER) : on transmet explicitement celles de Symfony.
    PassEnv APP_ENV APP_SECRET DATABASE_URL MONGODB_URL MONGODB_DB MAILER_DSN FRONTEND_URL CORS_ALLOW_ORIGIN

    <Directory /var/www/front>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/api/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
