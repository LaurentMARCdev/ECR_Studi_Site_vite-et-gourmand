# ═══════════════════════════════════════════════════════════════════
# Vhost Apache pour Vite & Gourmand
# ───────────────────────────────────────────────────────────────────
# Reproduit l'organisation de production Alwaysdata :
#   - DocumentRoot sur /var/www/front  (pages HTML statiques)
#   - Les requêtes /api/* sont routées vers Symfony via le .htaccess
#     du front qui fait un RewriteRule vers /index.php
#   - Un Alias /index.php pointe vers l'app Symfony
# ═══════════════════════════════════════════════════════════════════

<VirtualHost *:80>
    # ─── Front : pages HTML, CSS, JS, images ───────────────────────
    DocumentRoot /var/www/front

    # ─── Alias Symfony : les requêtes /api/* arrivent ici ───────────
    # Le .htaccess de front/ réécrit /api/foo vers /index.php?...
    # Cet alias dirige /index.php vers le front controller Symfony.
    Alias /index.php /var/www/api/public/index.php

    # ─── Permissions sur le front ──────────────────────────────────
    <Directory /var/www/front>
        # Permet au .htaccess du front d'être lu (rewrite /api/*)
        AllowOverride All
        Require all granted
    </Directory>

    # ─── Permissions sur l'API Symfony ─────────────────────────────
    <Directory /var/www/api/public>
        AllowOverride All
        Require all granted

        # Front controller Symfony : toutes les requêtes passent par index.php
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # ─── Variables d'environnement ─────────────────────────────────
    # Avec mod_php, les variables d'environnement du conteneur
    # ne sont PAS visibles dans $_SERVER par défaut. Sans PassEnv,
    # Symfony ne trouve pas DATABASE_URL et l'API renvoie des 500.
    PassEnv APP_ENV
    PassEnv APP_SECRET
    PassEnv DATABASE_URL
    PassEnv MONGODB_URL
    PassEnv MONGODB_DB
    PassEnv MAILER_DSN
    PassEnv MAILER_FROM_ADDRESS
    PassEnv MAILER_FROM_NAME
    PassEnv FRONTEND_URL
    PassEnv CORS_ALLOW_ORIGIN
    PassEnv CONTACT_EMAIL
    PassEnv COOKIE_SECURE
    PassEnv COOKIE_SAMESITE

    # ─── Logs ──────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/vitegourmand-error.log
    CustomLog ${APACHE_LOG_DIR}/vitegourmand-access.log combined
</VirtualHost>