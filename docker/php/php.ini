; Réglages PHP de l'environnement Docker (développement)
date.timezone = Europe/Paris
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
expose_php = Off

; OPcache : revalidation à chaque requête pour voir les modifications du code monté
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
