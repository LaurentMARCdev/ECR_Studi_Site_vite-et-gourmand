# ═══════════════════════════════════════════════════════════════
# Vite & Gourmand — environnement de développement conteneurisé
# ═══════════════════════════════════════════════════════════════
# Services :
#   app       PHP 8.2 + Apache : front statique + API Symfony   → http://localhost:8080
#   postgres  PostgreSQL 16 : base relationnelle (source de vérité)
#   mongo     MongoDB 7 : base NoSQL des statistiques
#   mongo-express (profil "outils") : interface web pour explorer MongoDB → http://localhost:8081
#
# Variables : copier .env.example en .env (le .env n'est pas versionné).
#   docker compose up -d --build
#   docker compose --profile outils up -d     # avec mongo-express
# ═══════════════════════════════════════════════════════════════

services:
  app:
    build: .
    image: vitegourmand-app:dev
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:?Renseigner APP_SECRET dans .env}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      MONGODB_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      MONGODB_DB: ${MONGODB_DB:-vitegourmand_stats}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      FRONTEND_URL: "http://localhost:${APP_PORT:-8080}"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      SEED_DEMO: ${SEED_DEMO:-1}
      DEMO_PASSWORD_CLIENT: ${DEMO_PASSWORD_CLIENT:-}
      DEMO_PASSWORD_EMPLOYE: ${DEMO_PASSWORD_EMPLOYE:-}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:-}
      SYNC_MONGO_ON_START: ${SYNC_MONGO_ON_START:-1}
    volumes:
      # Code monté depuis l'hôte : les modifications sont visibles immédiatement
      - ./api:/var/www/api
      - ./front:/var/www/front
      # vendor/ et var/ restent dans des volumes pour ne pas dépendre de l'hôte
      - vendor:/var/www/api/vendor
      - symfony_var:/var/www/api/var

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Renseigner MONGO_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      # Création de la collection et des index au premier démarrage
      - ./api/migrations/mongo/004_mongo_init.js:/docker-entrypoint-initdb.d/004_mongo_init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1
    profiles: ["outils"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Renseigner MONGO_EXPRESS_PASSWORD dans .env}

volumes:
  pgdata:
  mongodata:
  vendor:
  symfony_var:
